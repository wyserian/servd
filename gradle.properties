org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official

# servd release version - single source of truth. The build files, the packaging scripts, and the
# release CI all read this; a release tag must be v<this> (CI fails on a mismatch). Keep the
# Servd.VERSION constant (core/.../Servd.kt) in sync - CI checks that too.
servdVersion=1.6.0
